name: Deploy Website

# Deploys when a GitHub release is published, not when the tag is pushed: the
# installation page links the installers of the version in package.json
# (DownloadLink reads it through customFields), and those URLs only resolve
# once the release leaves its draft. The site is built from main rather than
# the release tag so a docs fix landed after the tag ships with the release,
# and `workflow_dispatch` redeploys main for docs-only changes in between
# releases (mind that a bumped-but-unpublished version on main would link a
# release that does not exist yet).
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    if: github.repository == 'Fluid-CAD/FluidCAD'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Build
        run: npm run build
        working-directory: website

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: website
          command: pages deploy ./build --project-name=fluidcad-docs --branch=main
