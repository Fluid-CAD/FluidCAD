# Every release automatically propagates to the viewer (FluidCAD-Viewer's
# deploy workflow builds this tag's engine bundle and redeploys the shell —
# decision D9: no approval gate).
#
# Required repo secret: VIEWER_DISPATCH_TOKEN — a fine-grained PAT with
# contents:read+write ("Actions: repository dispatch") on
# marwndev/FluidCAD-Viewer.
#
# Gated on the GitHub release being published (temporary, 2026-09-11): the
# desktop workflow leaves every release as a draft so the builds can be tested
# first, and the viewer must not redeploy before the manual
# `gh release edit --draft=false` flips the draft.
name: notify-viewer
on:
  release:
    types: [published]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch fluidcad-release to the viewer repo
        env:
          GH_TOKEN: ${{ secrets.VIEWER_DISPATCH_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh api repos/marwndev/FluidCAD-Viewer/dispatches \
            -f event_type=fluidcad-release \
            -F 'client_payload[tag]='"$TAG" \
            -F 'client_payload[version]='"${TAG#v}"
