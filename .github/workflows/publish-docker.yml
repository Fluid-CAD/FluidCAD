name: Publish Docker Image

# Gated on the GitHub release being published, like the VS Code extension: the
# desktop workflow leaves every release as a draft so the builds can be tested
# first, and the image must not appear before the manual
# `gh release edit --draft=false` flips the draft. The checkout below lands on
# the release tag because a `release` event's ref is `refs/tags/<tag>`.
#
# The image is pushed to ghcr.io/fluid-cad/fluidcad as `<version>` and
# `latest`. The first push creates the package; if it is not public already,
# make it public once under the organization's Packages settings (that cannot
# be undone), so `docker pull` works without signing in.
on:
  release:
    types: [published]

jobs:
  publish:
    if: github.repository == 'Fluid-CAD/FluidCAD'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Describe the image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/fluid-cad/fluidcad
          # `v0.0.47` becomes `0.0.47`; `latest` follows the newest release.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
