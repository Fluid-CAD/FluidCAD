name: Publish VSCode Extension

# Gated on the GitHub release being published (temporary, 2026-09-11): the
# desktop workflow leaves every release as a draft so the builds can be tested
# first, and the extension must not reach the marketplace before that manual
# `gh release edit --draft=false` flips the draft. The checkout below lands on
# the release tag because a `release` event's ref is `refs/tags/<tag>`.
on:
  release:
    types: [published]

jobs:
  publish:
    if: github.repository == 'Fluid-CAD/FluidCAD'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm i
        working-directory: extension/vscode

      - name: Publish to VS Marketplace
        run: npx @vscode/vsce publish --no-dependencies
        working-directory: extension/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
