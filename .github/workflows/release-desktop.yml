name: Build Desktop App

# The shell is built per platform (electron-builder needs the host OS for dmg
# and nsis), and each build stages its own built-in engine from the tarball
# `build-engine-tarball.ts` produces.
#
# macOS builds are signed with a Developer ID Application certificate and
# notarized (2026-08-16); the secrets involved are listed on the "Prepare macOS
# signing" step below. Windows is still unsigned: no certificate yet, so
# SmartScreen warns on first run.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  desktop:
    if: github.repository == 'Fluid-CAD/FluidCAD'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            flags: --linux --x64
          - os: macos-latest
            target: darwin-arm64
            flags: --mac --arm64
          # `macos-13`, the last Intel image under the plain `macos-N` label, was
          # retired by GitHub; `macos-15-intel` is the Intel image that remains.
          - os: macos-15-intel
            target: darwin-x64
            flags: --mac --x64
          - os: windows-latest
            target: win32-x64
            flags: --win --x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install engine dependencies
        run: npm ci

      - name: Build the engine
        run: npm run build

      - name: Install shell dependencies
        run: npm ci
        working-directory: shell

      - name: Build the shell
        run: npm run build
        working-directory: shell

      - name: Stage the built-in engine
        run: node scripts/stage-engine.js --target ${{ matrix.target }}
        working-directory: shell

      - name: Prepare macOS signing
        # Secrets (repository → Settings → Secrets and variables → Actions):
        #   MACOS_CERTIFICATE      base64 of the Developer ID Application .p12
        #                          (`openssl base64 -A -in certificate.p12`)
        #   MACOS_CERTIFICATE_PWD  the .p12 export password
        #   APPLE_API_KEY_B64      base64 of the App Store Connect AuthKey_*.p8
        #   APPLE_API_KEY_ID       its 10-character Key ID
        #   APPLE_API_ISSUER       the Issuer ID of the key
        # electron-builder imports the .p12 into a temporary keychain from
        # CSC_LINK / CSC_KEY_PASSWORD, and notarytool reads the .p8 from the
        # absolute path in APPLE_API_KEY. Everything is exported through
        # GITHUB_ENV from a macOS-only step rather than set on the build step
        # for every runner: electron-builder would otherwise pick CSC_LINK up on
        # Windows too and try to sign the NSIS installer with an Apple
        # certificate.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/private_keys"
          mkdir -p "$key_dir"
          key_file="$key_dir/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$key_file"
          {
            echo "CSC_LINK=$MACOS_CERTIFICATE"
            echo "CSC_KEY_PASSWORD=$MACOS_CERTIFICATE_PWD"
            echo "APPLE_API_KEY=$key_file"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Build and publish the app
        # The arch is pinned per runner: the config lists both macOS arches so a
        # local `npm run dist` builds what the machine can, but in CI each
        # runner builds its own and nothing is cross-compiled twice.
        # `mac.forceCodeSigning` turns "skipped macOS code signing" from a log
        # line into a failure here — a release must never publish an unsigned
        # macOS build (Gatekeeper would refuse it and electron-updater could
        # not install it) — while the config itself leaves it off so a machine
        # without the certificate can still build locally.
        run: npx electron-builder ${{ matrix.flags }} --publish always -c.mac.forceCodeSigning=true
        working-directory: shell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows has no certificate; keep electron-builder from hunting for
          # one and failing the build. On macOS the identity comes from the
          # keychain the previous step's CSC_LINK is imported into, so
          # discovery has to stay on there.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' }}
