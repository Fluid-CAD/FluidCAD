name: Release Desktop App

# One workflow, three stages, one GitHub release:
#
#   engines  → build the four engine tarballs and upload them to a *draft*
#              release for the tag
#   desktop  → one job per platform (electron-builder needs the host OS for
#              dmg and nsis); each stages its own built-in engine from the
#              tarball `build-engine-tarball.ts` produces, then uploads its
#              installers and updater feeds into that same draft
#   publish  → flip the draft to a public release once everything is on it
#
# The draft is load-bearing. electron-updater lists only published releases,
# and the shell downloads pinned engines from published assets, so a release
# must not become visible until every tarball and every `latest*.yml` is on
# it. Two separate workflows used to race for the release: whichever job got
# there first decided whether it was created as a draft (never published) or
# as a public release with most of its assets still missing.
#
# macOS builds are signed with a Developer ID Application certificate and
# notarized (2026-08-16); the secrets involved are listed on the "Prepare macOS
# signing" step below. Windows ships unsigned on purpose (2026-09-09): the
# Microsoft Store was considered and deferred, and a code-signing certificate
# is a separate expense. SmartScreen warns on first run; the installation
# page tells users to choose "More info → Run anyway". electron-updater still
# installs unsigned Windows updates — with no `publisherName` in the config
# there is no signature to verify.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  engines:
    if: github.repository == 'Fluid-CAD/FluidCAD'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build the package
        run: npm run build

      # All four targets come out of this one Linux job: npm's `--os`/`--cpu`
      # flags fetch the right prebuilt binaries, so no build matrix is needed.
      - name: Build engine tarballs
        run: npm run build:engine -- --all

      - name: Report sizes
        run: ls -lh dist-engines

      - name: Create the draft release and upload the tarballs
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          # workflow_dispatch runs off a branch, where the tag may not exist
          # yet; `--target` pins the tag GitHub then creates to this commit
          # instead of the default branch's head.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "$TAG" --notes "FluidCAD $VERSION"
          fi
          gh release upload "$TAG" dist-engines/*.tar.gz dist-engines/*.json --clobber
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Archive engine manifests
        uses: actions/upload-artifact@v4
        with:
          name: engine-manifests
          path: dist-engines/*.json

  desktop:
    needs: engines
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            flags: --linux --x64
          # Apple Silicon only. A second Intel runner would also race this one
          # for `latest-mac.yml`: the GitHub publisher overwrites an existing
          # asset, so the updater feed would list only the arch that finished
          # last.
          - os: macos-latest
            target: darwin-arm64
            flags: --mac --arm64
          - os: windows-latest
            target: win32-x64
            flags: --win --x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install engine dependencies
        run: npm ci

      - name: Build the engine
        run: npm run build

      - name: Install shell dependencies
        run: npm ci
        working-directory: shell

      - name: Build the shell
        run: npm run build
        working-directory: shell

      - name: Stage the built-in engine
        run: node scripts/stage-engine.js --target ${{ matrix.target }}
        working-directory: shell

      - name: Prepare macOS signing
        # Secrets (repository → Settings → Secrets and variables → Actions):
        #   MACOS_CERTIFICATE      base64 of the Developer ID Application .p12
        #                          (`openssl base64 -A -in certificate.p12`)
        #   MACOS_CERTIFICATE_PWD  the .p12 export password
        #   APPLE_API_KEY_B64      base64 of the App Store Connect AuthKey_*.p8
        #   APPLE_API_KEY_ID       its 10-character Key ID
        #   APPLE_API_ISSUER       the Issuer ID of the key
        # electron-builder imports the .p12 into a temporary keychain from
        # CSC_LINK / CSC_KEY_PASSWORD, and notarytool reads the .p8 from the
        # absolute path in APPLE_API_KEY. Everything is exported through
        # GITHUB_ENV from a macOS-only step rather than set on the build step
        # for every runner: electron-builder would otherwise pick CSC_LINK up on
        # Windows too and try to sign the NSIS installer with an Apple
        # certificate.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/private_keys"
          mkdir -p "$key_dir"
          key_file="$key_dir/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$key_file"
          {
            echo "CSC_LINK=$MACOS_CERTIFICATE"
            echo "CSC_KEY_PASSWORD=$MACOS_CERTIFICATE_PWD"
            echo "APPLE_API_KEY=$key_file"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Build the app and upload it to the draft release
        # The arch is pinned per runner so nothing is cross-compiled twice.
        # `mac.forceCodeSigning` turns "skipped macOS code signing" from a log
        # line into a failure here — a release must never publish an unsigned
        # macOS build (Gatekeeper would refuse it and electron-updater could
        # not install it) — while the config itself leaves it off so a machine
        # without the certificate can still build locally.
        # `publish.releaseType: draft` in electron-builder.yml makes the
        # publisher upload into the draft the engines job created and never
        # create a public release of its own; the publish job below does that.
        run: npx electron-builder ${{ matrix.flags }} --publish always -c.mac.forceCodeSigning=true
        working-directory: shell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows has no certificate; keep electron-builder from hunting for
          # one and failing the build. On macOS the identity comes from the
          # keychain the previous step's CSC_LINK is imported into, so
          # discovery has to stay on there.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' }}

  publish:
    # Runs only when every platform succeeded (`fail-fast: false` lets the
    # others finish, but a failed one still skips this job). A partial release
    # stays a draft for someone to look at, never a public release missing a
    # platform.
    needs: [engines, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.engines.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
