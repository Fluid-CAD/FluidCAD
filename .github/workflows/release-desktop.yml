name: Release Desktop App

# One workflow, three stages, one GitHub release:
#
#   engines  → build the four engine tarballs and upload them to a *draft*
#              release for the tag
#   desktop  → one job per platform (electron-builder needs the host OS for
#              dmg and nsis); each stages its own built-in engine from the
#              tarball `build-engine-tarball.ts` produces, then uploads its
#              installers and updater feeds into that same draft
#   verify   → list what landed on the draft; the release stays a draft
#
# The draft is load-bearing. electron-updater lists only published releases,
# and the shell downloads pinned engines from published assets, so a release
# must not become visible until every tarball and every `latest*.yml` is on
# it. Two separate workflows used to race for the release: whichever job got
# there first decided whether it was created as a draft (never published) or
# as a public release with most of its assets still missing.
#
# Publishing is a manual step so the builds can be tested first. Once the
# draft's installers check out, run:
#
#   gh release edit vX.Y.Z --repo Fluid-CAD/FluidCAD --draft=false --latest
#
# macOS builds are signed with a Developer ID Application certificate and
# notarized (2026-08-16); the secrets involved are listed on the "Prepare macOS
# signing" step below. Windows ships unsigned on purpose (2026-09-09): the
# Microsoft Store was considered and deferred, and a code-signing certificate
# is a separate expense. SmartScreen warns on first run; the installation
# page tells users to choose "More info → Run anyway". electron-updater still
# installs unsigned Windows updates — with no `publisherName` in the config
# there is no signature to verify.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  engines:
    if: github.repository == 'Fluid-CAD/FluidCAD'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build the package
        run: npm run build

      # All four targets come out of this one Linux job: npm's `--os`/`--cpu`
      # flags fetch the right prebuilt binaries, so no build matrix is needed.
      - name: Build engine tarballs
        run: npm run build:engine -- --all

      - name: Report sizes
        run: ls -lh dist-engines

      - name: Create the draft release and upload the tarballs
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          # workflow_dispatch runs off a branch, where the tag may not exist
          # yet; `--target` pins the tag GitHub then creates to this commit
          # instead of the default branch's head.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "$TAG" --notes "FluidCAD $VERSION"
          fi
          gh release upload "$TAG" dist-engines/*.tar.gz dist-engines/*.json --clobber
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Archive engine manifests
        uses: actions/upload-artifact@v4
        with:
          name: engine-manifests
          path: dist-engines/*.json

  desktop:
    needs: engines
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            flags: --linux --x64
          # Apple Silicon only. A second Intel runner would also race this one
          # for `latest-mac.yml`: the GitHub publisher overwrites an existing
          # asset, so the updater feed would list only the arch that finished
          # last.
          - os: macos-latest
            target: darwin-arm64
            # `-c.mac.forceCodeSigning=true` turns "skipped macOS code
            # signing" from a log line into a failure: a release must never
            # publish an unsigned macOS build (Gatekeeper would refuse it and
            # electron-updater could not install it), while the config itself
            # leaves it off so a machine without the certificate can still
            # build locally. It lives here, not on the build step, because
            # PowerShell on the Windows runner splits `-c.mac…` into `-c` +
            # a config-file path and electron-builder fails with ENOENT.
            flags: --mac --arm64 -c.mac.forceCodeSigning=true
          - os: windows-latest
            target: win32-x64
            flags: --win --x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install engine dependencies
        run: npm ci

      - name: Build the engine
        run: npm run build

      - name: Install shell dependencies
        run: npm ci
        working-directory: shell

      - name: Build the shell
        run: npm run build
        working-directory: shell

      - name: Stage the built-in engine
        run: node scripts/stage-engine.js --target ${{ matrix.target }}
        working-directory: shell

      - name: Prepare macOS signing
        # Secrets (repository → Settings → Secrets and variables → Actions):
        #   MACOS_CERTIFICATE      base64 of the Developer ID Application .p12
        #                          (`openssl base64 -A -in certificate.p12`)
        #   MACOS_CERTIFICATE_PWD  the .p12 export password
        #   APPLE_API_KEY_B64      base64 of the App Store Connect AuthKey_*.p8
        #   APPLE_API_KEY_ID       its 10-character Key ID
        #   APPLE_API_ISSUER       the Issuer ID of the key
        # The keychain is built here rather than handed to electron-builder as
        # CSC_LINK / CSC_KEY_PASSWORD: electron-builder 26.15 creates its
        # temporary keychain with a random password and then runs
        # `set-key-partition-list` with the .p12 password instead, which
        # macOS 26 (the current macos-latest) rejects with "SecKeychainUnlock:
        # The user name or passphrase you entered is not correct". With
        # CSC_LINK unset and CSC_KEYCHAIN pointing at this keychain,
        # electron-builder skips its import and discovers the Developer ID
        # identity here. notarytool reads the .p8 from the absolute path in
        # APPLE_API_KEY. Everything is exported through GITHUB_ENV from a
        # macOS-only step rather than set on the build step for every runner.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/fluidcad-signing.keychain-db"
          keychain_password=$(openssl rand -base64 32)
          certificate="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PWD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$certificate"
          security find-identity -v -p codesigning "$keychain"
          key_dir="$RUNNER_TEMP/private_keys"
          mkdir -p "$key_dir"
          key_file="$key_dir/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$key_file"
          {
            echo "CSC_KEYCHAIN=$keychain"
            echo "APPLE_API_KEY=$key_file"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Build the app and upload it to the draft release
        # The arch is pinned per runner so nothing is cross-compiled twice.
        # `publish.releaseType: draft` in electron-builder.yml makes the
        # publisher upload into the draft the engines job created and never
        # create a public release of its own; the release stays a draft until
        # the manual publish in the header.
        run: npx electron-builder ${{ matrix.flags }} --publish always
        working-directory: shell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows has no certificate; keep electron-builder from hunting for
          # one and failing the build. On macOS the identity comes from the
          # keychain the previous step built (CSC_KEYCHAIN), so discovery has
          # to stay on there.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' }}

  verify:
    # Runs only when every platform succeeded (`fail-fast: false` lets the
    # others finish, but a failed one still skips this job). The release is
    # never published here: it stays a draft so the installers can be tested
    # before the manual `gh release edit --draft=false --latest` in the header.
    needs: [engines, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: List the draft release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.engines.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets \
            --jq '"draft: \(.isDraft)", (.assets[].name)'
          echo "Release $TAG left as a draft. Publish it once the builds are tested:"
          echo "  gh release edit $TAG --repo $GITHUB_REPOSITORY --draft=false --latest"
