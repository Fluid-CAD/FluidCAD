appId: io.fluidcad.desktop
productName: FluidCAD
copyright: Copyright © Marwan Aouida

# One naming scheme for every platform: `FluidCAD-0.0.43-win-x64.exe`,
# `FluidCAD-0.0.43-mac-arm64.dmg`, `FluidCAD-0.0.43-linux-x86_64.AppImage`,
# `FluidCAD-0.0.43-linux-amd64.deb` (Linux targets spell `${arch}` their own
# way). The defaults differ per target (`FluidCAD Setup 0.0.43.exe`, with
# spaces, for NSIS; `fluidcad-desktop_0.0.43_amd64.deb` for the deb), which
# made the download list hard to read and the installation page hard to
# write. electron-updater reads the names from `latest*.yml`, so it follows
# along. The installation page lists these names; keep the two in step.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - static/**/*
  - package.json
  - "!**/*.map"

# The engine is staged by `scripts/stage-engine.js` and shipped **outside**
# app.asar on purpose: it runs a live Vite server and loads native binaries and
# wasm, all of which need real file paths. `main.ts` points the engine cache at
# `process.resourcesPath/engine`, so the built-in engine is just a pre-seeded
# cache entry (P2-2).
# Written verbatim as a glob string: the `{from, to}` object form silently
# copies nothing here, so the staging directory is named to land where it is
# needed instead — `shell/engine/` → `resources/engine/` in the bundle.
extraResources:
  - engine/**/*

asar: true

# `.fluid.js`'s extension is, to every operating system, `.js`. Claiming it as
# the default handler would make FluidCAD the default editor for every
# JavaScript file on the machine, which is not a trade anyone would accept.
# `rank: Alternate` (macOS) and NSIS's OpenWithProgids registration put FluidCAD
# in "Open With" instead: the user chooses it once, the OS remembers, and no
# other tool loses its association. Opening a file opens the workspace that
# holds it — see `workspaceForPath` in `src/state.ts`.
fileAssociations:
  - ext: js
    name: FluidCAD Model
    description: FluidCAD parametric model
    role: Editor
    rank: Alternate

mac:
  category: public.app-category.graphics-design
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  # Signed with the "Developer ID Application" identity electron-builder
  # imports from CSC_LINK / CSC_KEY_PASSWORD (see release-desktop.yml), then
  # notarized through notarytool with the App Store Connect API key in
  # APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER. Nothing is pinned by
  # name on purpose so a local `npm run dist` keeps working: on a machine
  # without the identity electron-builder logs that it skipped signing and,
  # because notarization only runs after a successful sign, skips that too;
  # on a machine that has the identity but not the API key it signs and logs
  # that it skipped notarization. Neither is an error.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true

dmg:
  # The .app inside is signed and notarized; signing the disk image as well
  # only invites the double-signature/stapling mismatches that make Gatekeeper
  # reject an otherwise valid download.
  sign: false

win:
  target:
    - target: nsis
      arch: [x64]
  # Unsigned on purpose (2026-09-09): the Microsoft Store was considered and
  # deferred, and a code-signing certificate is a separate expense. SmartScreen
  # warns on first run; the installation page tells users to choose
  # "More info → Run anyway". The executable is still edited (icon, version
  # resources), just not signed.
  signAndEditExecutable: true
  # There is no certificate, so there is no publisher to verify an update
  # against; electron-updater would skip the check anyway with no
  # `publisherName`, and this says so out loud. Turn it back on the day a
  # certificate is added, or updates could be swapped in transit.
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

linux:
  category: Graphics
  syncDesktopName: true
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  synopsis: Parametric CAD you write in JavaScript
  desktop:
    entry:
      MimeType: text/javascript;application/javascript

publish:
  provider: github
  owner: Fluid-CAD
  repo: FluidCAD
  # Draft, never release: the publisher uploads into the draft the engines job
  # of `release-desktop.yml` created for the tag, and that workflow's publish
  # job makes the release public once every platform's assets are on it.
  # electron-updater only lists published releases, so a release that went
  # public with a platform still building would offer nothing to update to —
  # or, worse, a `latest.yml` pointing at an installer not yet uploaded.
  releaseType: draft
