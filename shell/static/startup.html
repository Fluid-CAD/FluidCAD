<!doctype html>
<!--
  The shell's fallback page: what a window shows when the start screen cannot
  be used — the app has no built-in engine page, it failed to load, its
  renderer kept crashing, it never said hello, or it speaks another protocol
  (the reason is logged to the terminal). It has to work with no engine at
  all, which is why it lives in the shell and is plain HTML.

  It speaks the same `window.fluidcadShell.start` contract as the real start
  screen, so the window's opening progress and errors show here as well.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
    <title>FluidCAD</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1e1e1e;
        --fg: #e7e7e7;
        --muted: #9a9a9a;
        --accent: #4a9eff;
        --error: #ff8b8b;
        --track: #ffffff14;
        --button: #ffffff14;
        --button-hover: #ffffff24;
        --button-border: #ffffff26;
      }
      :root[data-theme="fluidcad-light"] {
        color-scheme: light;
        --bg: #ffffff;
        --fg: #1f2937;
        --muted: #6b7280;
        --accent: #2563eb;
        --error: #dc2626;
        --track: #0000000f;
        --button: #0000000a;
        --button-hover: #00000014;
        --button-border: #00000026;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 400 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        display: grid;
        place-items: center;
        -webkit-user-select: none;
        user-select: none;
      }
      main { width: min(460px, 78vw); text-align: center; }
      .mark {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.02em;
        margin-bottom: 22px;
      }
      .status { color: var(--muted); min-height: 20px; }
      .detail { color: var(--muted); opacity: 0.75; font-size: 12px; margin-top: 6px; word-break: break-word; }
      .track {
        height: 4px;
        border-radius: 999px;
        background: var(--track);
        overflow: hidden;
        margin: 18px 0 4px;
      }
      .bar {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: var(--accent);
        transition: width 120ms linear;
      }
      .track.indeterminate .bar {
        width: 35%;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(300%); }
      }
      .error {
        color: var(--error);
        text-align: left;
        white-space: pre-wrap;
        margin-top: 10px;
        -webkit-user-select: text;
        user-select: text;
      }
      .actions { display: flex; gap: 10px; justify-content: center; margin-top: 18px; }
      button {
        font: inherit;
        color: var(--fg);
        background: var(--button);
        border: 1px solid var(--button-border);
        border-radius: 7px;
        padding: 6px 14px;
        cursor: pointer;
      }
      button:hover { background: var(--button-hover); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">FluidCAD</div>
      <div id="status" class="status"></div>
      <div id="track" class="track indeterminate" hidden><div id="bar" class="bar"></div></div>
      <div id="detail" class="detail"></div>
      <div id="error" class="error" hidden></div>
      <div class="actions">
        <button id="open" hidden>Open project…</button>
        <button id="cancel" hidden>Cancel</button>
        <button id="back" hidden>Back</button>
        <button id="retry" hidden>Try again</button>
      </div>
    </main>
    <script>
      const theme = new URLSearchParams(location.search).get('theme');
      if (theme === 'fluidcad-light') {
        document.documentElement.dataset.theme = theme;
      }

      const api = window.fluidcadShell?.start;
      const $ = (id) => document.getElementById(id);
      const status = $('status');
      const detail = $('detail');
      const track = $('track');
      const bar = $('bar');
      const error = $('error');
      const buttons = { open: $('open'), cancel: $('cancel'), back: $('back'), retry: $('retry') };

      buttons.open.onclick = () => api?.openDialog();
      buttons.cancel.onclick = () => api?.cancelOpen();
      buttons.back.onclick = () => api?.cancelOpen();
      buttons.retry.onclick = () => api?.retryOpen();

      const mb = (bytes) => `${(bytes / 1024 / 1024).toFixed(1)} MB`;

      function show(...names) {
        for (const [name, button] of Object.entries(buttons)) {
          button.hidden = !names.includes(name);
        }
      }

      function progress(fraction) {
        track.hidden = false;
        track.classList.toggle('indeterminate', fraction === null);
        bar.style.width = fraction === null ? '' : `${Math.round(fraction * 100)}%`;
      }

      function render(state) {
        error.hidden = true;
        track.hidden = true;
        detail.textContent = '';
        if (state.phase === 'home') {
          status.textContent = 'The start screen is not available. You can still open a project.';
          show('open');
          return;
        }
        if (state.phase === 'failed') {
          status.textContent = `${state.project.name} could not be opened.`;
          error.hidden = false;
          error.textContent = state.message;
          show('back', 'retry');
          return;
        }
        show('cancel');
        const step = state.status;
        if (step.step === 'resolving') {
          status.textContent = `Opening ${state.project.name}…`;
          detail.textContent = state.project.path;
          progress(null);
        } else if (step.step === 'downloading') {
          status.textContent = `Downloading engine ${step.version}…`;
          if (step.totalBytes) {
            progress(step.receivedBytes / step.totalBytes);
            detail.textContent = `${mb(step.receivedBytes)} of ${mb(step.totalBytes)}`;
          } else {
            progress(null);
            detail.textContent = step.receivedBytes
              ? mb(step.receivedBytes)
              : 'This project pins a version that is not installed yet.';
          }
        } else if (step.step === 'starting') {
          status.textContent = `Starting engine ${step.version}…`;
          detail.textContent = step.source === 'project' ? "Using this project's own install." : '';
          progress(null);
        }
      }

      if (api) {
        api.onWindowState(render);
        api.windowState().then(render);
      }
    </script>
  </body>
</html>
